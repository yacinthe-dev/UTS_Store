{%extends "posts/base.html"%}
{%block contenu%}
   <div class="row justify-content-center">
      <div class="col-md-5">
         <div class="card shadow p-4">

      <h3 class="mb-4">Se connecter</h3>
   {%if erreur%}
     <div class="alert alert-danger" >{{erreur}}</div>
  {%endif%}

  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
       <label class="form-label">Email</label> 
       <input type="email" name="email" class="form-control" placeholder="(ton@email)" required>
    </div> 

    <div class="mb-3">
       <label class="form-label">Mot de passe</label> 
       <input type="password" name="mot_de_passe" class="form-control" placeholder="....." required>
    </div> 
    <button class="btn btn-primary w-100">Se connecter</button>
</form>   
 
<p class="text-center mt-3">
    Pas encors de compte ?<a href=""{url 'inscription'%}>S'inscrire</a>
</p>
</div> 
</div>
</div>
{% endblock %}
