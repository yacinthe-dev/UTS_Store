{% extends "posts/base.html" %}
{% block contenu %}
<div class="container mt-4">
  <h1 class="mb-3">Mes commandes</h1>

  <table class="table table-striped table-hover">
    <thead class="table-dark">
      <tr>
        <th>N°</th>
        <th>Date</th>
        <th>Total</th>
        <th>Statut</th>
      </tr>
    </thead>
    <tbody>
      {% for c in commandes %}
      <tr>
        <td>{{ c.id }}</td>
        <td>{{ c.date_commande|date:"d/m/Y" }}</td>
        <td>{{ c.total }} FCFA</td>
        <td><span class="badge bg-secondary">{{ c.statut }}</span></td>
      </tr>
      {% empty %}
      <tr>
        <td colspan="4" class="text-center">Aucune commande pour le moment.</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
